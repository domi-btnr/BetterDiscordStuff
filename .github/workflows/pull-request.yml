name: Pull Request
on: 
    pull_request

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: true
      - name: Run ESLint
        run: pnpm exec eslint

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: true
      - name: Run Prettier
        run: pnpm exec prettier --check .

  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: true
      - name: Run TypeScript
        run: pnpm exec tsc --noEmit -p tsconfig.json

  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: true
      - name: Get changed files
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }}
          BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          files=$(git diff --name-only --diff-filter=AMR $BASE HEAD | tr '\n' ' ')

          if echo "$files" | tr ' ' '\n' | grep -q '^src/common/'; then
            echo "changed_files=$(find src/plugins -mindepth 1 -maxdepth 1 -type d | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else
            echo "changed_files=$files" >> $GITHUB_OUTPUT
          fi
      - name: Build plugins
        run: |
          pnpm build ${{ steps.changed-files.outputs.changed_files }}